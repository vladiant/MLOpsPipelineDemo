# Prometheus scrape configuration for the local MLOps stack (SRS FR-15, FR-23).
# Two targets: the service's own OTel Prometheus exporter (authoritative pull path)
# and the OTel Collector's re-exposed metrics (reference-parity push path).

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Authoritative pull path: the FastAPI service exposes mlops_* metrics directly.
  - job_name: mlops-serving
    metrics_path: /metrics
    static_configs:
      - targets: ["serving:8000"]
        labels:
          service: mlops-serving

  # Reference-parity path: metrics the app also pushes via OTLP to the collector,
  # which re-exposes them for scraping (Tempo/Loki deferred, OQ-6).
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector
