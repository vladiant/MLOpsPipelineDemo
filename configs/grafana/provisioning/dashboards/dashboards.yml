# Grafana dashboard provider — loads JSON dashboards on startup (SRS FR-23, AC-11).
apiVersion: 1

providers:
  - name: mlops
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
